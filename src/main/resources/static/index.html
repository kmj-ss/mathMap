<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mathMap</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home">
  <header class="topbar">
    <h1>mathMap</h1>
    <button id="logout-btn" class="hidden">로그아웃</button>
  </header>

  <main class="student-main">
    <section id="login-view" class="card narrow hidden">
      <h2>방 만들기</h2>
      <p class="muted">선생님 비밀번호를 입력하면 방을 만들 수 있어요.<br>학생은 선생님이 공유한 방 주소로 들어오세요.</p>
      <form id="login-form">
        <label>선생님 비밀번호<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="primary">확인</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <div id="rooms-view" class="hidden">
      <section class="card">
        <h2>새 방 만들기</h2>
        <form id="create-form" class="row" autocomplete="off">
          <input id="room-name-input" class="grow" maxlength="30" placeholder="예: 3학년 2반 수학" required>
          <button type="submit" class="primary">방 만들기</button>
        </form>
        <p id="create-error" class="error" role="alert"></p>
      </section>

      <section class="card">
        <h2>내 방</h2>
        <ul id="room-list" class="room-list"></ul>
      </section>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
