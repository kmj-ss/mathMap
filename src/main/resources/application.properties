spring.application.name=mathmap
server.port=${PORT:8080}

# 클라우드(HTTPS 프록시) 뒤에서 실행될 때 원래 프로토콜(https)을 인식
server.forward-headers-strategy=framework

# 세션 쿠키: 자바스크립트에서 읽을 수 없고, 다른 사이트에서 보낸 요청에는 실리지 않음
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${MATHMAP_SECURE_COOKIE:false}
server.servlet.session.timeout=6h
server.servlet.session.tracking-modes=cookie

# 이미지 업로드 크기 제한
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 에러 화면에 내부 정보 노출 안 함
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# 선생님 비밀번호 (환경변수 MATHMAP_TEACHER_PASSWORD 로 설정. 비어 있으면 실행 때마다 임시 비밀번호를 로그에 출력)
mathmap.teacher-password=${MATHMAP_TEACHER_PASSWORD:}
mathmap.secure-headers.hsts=${MATHMAP_SECURE_COOKIE:false}
